<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#22262A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-256.png">
<link rel="apple-touch-icon" href="icon-256.png">
<script>window.AP_WEB = {version: "1.12.2"};</script>
<title>Arbeitsplaner</title>
<style>
@font-face{font-family:"Inter";src:url("fonts/inter.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url("fonts/space-grotesk.woff2") format("woff2");font-weight:300 700;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains-mono.woff2") format("woff2");font-weight:100 800;font-display:swap}
/* Layout: zwei schwebende Karten – Seitenleiste (Navigation + Kontext je Bereich) und Arbeitsfläche; Details als dritte Karte bzw. Schublade */
:root{
  --font-body:"Inter", "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-head:"Space Grotesk", "Inter", "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Consolas, "Cascadia Mono", monospace;
  --side:296px; --detail:400px;
  /* Fallback-Farben (werden vom Farbthema überschrieben) */
  --bg:#0E0D0C; --panel:#161514; --card:#1D1C1A; --card-2:#252320; --hover:#2C2A27; --line:#2A2825; --line-2:#3A3733;
  --fg:#F3EFE9; --fg-2:#B9B2A9; --fg-3:#8E877E;
  --accent:#F5A524; --accent-2:#F7B54A; --accent-soft:#3A2A12; --accent-line:#8A5E18; --accent-text:#F5A524; --on-accent:#1A1206;
  --p-high:#F07167; --p-med:#F2B23E; --p-low:#6CB4EE; --neg:#F4A06A; --ue:#7CC4F2; --ok:#86C95A; --ok-soft:#1E2A16; --ok-line:#3E5A2A;
  --scrim:rgb(0 0 0 / .62); --shadow:0 18px 50px rgb(0 0 0 / .45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--bg);padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{background:transparent;border:0;outline:none}
input::placeholder,textarea::placeholder{color:var(--fg-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}
h1,h2,h3{font-family:var(--font-head);margin:0;letter-spacing:-.02em;text-wrap:balance}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--font-mono)}
.muted{color:var(--fg-3)}
.sp{flex:1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;height:0;width:0}

/* Grundgerüst */
.shell{display:flex;flex-direction:column;height:100%}
#app{flex:1;min-height:0;display:flex;gap:12px;padding-block:12px;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px))}
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:20px}

/* Seitenleiste */
.sidebar{width:var(--side);flex:none;display:flex;flex-direction:column;gap:14px;padding:16px;min-height:0}
.side-head{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:16px;background:var(--card)}
.brand-btn{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left;line-height:1.25}
.brand-sub{font-size:12.5px;font-weight:600;color:var(--accent-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brand-logo{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand-logo .i{width:17px;height:17px;stroke-width:2.8}
.brand{font-family:var(--font-head);font-weight:700;font-size:17.5px;letter-spacing:-.01em}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:22px;background:var(--card);color:var(--fg-2)}
.search input{flex:1;min-width:0;height:100%;color:var(--fg)}
.side-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;margin:0 -6px;padding:2px 6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:13px;width:100%;height:42px;padding:0 16px;border-radius:21px;color:var(--fg);font-weight:500;font-size:14.5px;text-align:left;transition:background .12s}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.nav-item .i{width:19px;height:19px}
.nav-item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:12.5px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.nav-item.on .cnt{color:var(--on-accent)}
.nav-item .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin:0 4px;flex:none}
.nav-item .edit{display:none;width:26px;height:26px;border-radius:8px;place-items:center;color:var(--fg-2)}
.nav-item:hover .edit,.nav-item.on .edit{display:grid}
.nav-item:hover .edit + .cnt,.nav-item.on .edit + .cnt{display:none}
@media (hover:none){ .nav-item .edit{display:grid} .nav-item .edit + .cnt{display:none} }
.nav.small .nav-item{height:38px;font-size:14px;color:var(--fg-2)}
.nav.small .nav-item.on{color:var(--on-accent)}
.side-label{display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2)}
.side-label button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--fg-2)}
.side-label button:hover{background:var(--hover);color:var(--fg)}
.side-box{border:1px dashed var(--line-2);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.side-box p,.side-card .hint{margin:0;font-size:13.5px;color:var(--fg-2);line-height:1.5}
.side-box .side-label{padding:0}
.side-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.side-card h3{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.side-card h3 small{font-family:var(--font-body);font-size:12.5px;font-weight:500;color:var(--fg-2)}
.side-card .sub{font-size:13px;color:var(--fg-2);margin-top:-8px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:19px;background:var(--card-2);font-weight:600;font-size:13.5px;align-self:flex-start}
.pill-btn:hover{background:var(--hover)}
.pill-btn .i{width:15px;height:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 8px;font-size:13.5px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.mini-task{display:flex;align-items:center;gap:12px;padding:6px 2px;cursor:pointer;border-radius:8px}
.mini-task:hover .mt-title{color:var(--accent-text)}
.mini-task .chk{width:20px;height:20px}
.mt-title{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-time{font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.drag-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);font-size:14px;font-weight:500;cursor:grab}
.drag-item .i{width:14px;height:14px;color:var(--fg-3)}
.drag-item:hover{border-color:var(--line-2)}
.stepper-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--fg-2)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:12px;height:40px;background:var(--panel)}
.stepper button{width:34px;height:100%;display:grid;place-items:center;color:var(--fg-2);font-size:16px}
.stepper button:hover{color:var(--fg)}
.stepper b{min-width:58px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.tpl{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);font-weight:500;font-size:14px;width:100%;text-align:left}
.tpl:hover{border-color:var(--accent-line)}
.tpl .i{margin-left:auto;color:var(--accent-text)}
.session{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--fg-2)}
.session b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:6px;border-radius:18px;background:var(--card)}
.vb{position:relative;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--fg-2);transition:background .12s,color .12s}
.vb:hover{background:var(--hover);color:var(--fg)}
.vb.on{background:var(--accent);color:var(--on-accent)}
.vb .i{width:21px;height:21px}
.tbadge{position:absolute;top:2px;right:2px;font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--accent);color:var(--on-accent);padding:0 4px;border-radius:5px;line-height:14px}
.vb.on .tbadge{background:var(--on-accent);color:var(--accent)}
.side-foot{display:flex;align-items:center;gap:6px;padding:0 4px}
.sync-btn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:10px;font-size:13.5px;color:var(--fg-2);text-align:left}
.sync-btn:hover{color:var(--fg);background:var(--hover)}
.sync-btn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gear{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg-2);flex:none}
.gear:hover{background:var(--hover);color:var(--fg)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--fg-3);flex:none}
.sdot.synced{background:var(--ok)} .sdot.connecting{background:var(--accent);animation:pulse 1.2s infinite} .sdot.offline,.sdot.error{background:var(--p-high)} .sdot.setup{background:var(--accent)}
@keyframes pulse{50%{opacity:.35}}

/* Arbeitsfläche */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.view{flex:1;min-height:0;overflow-y:auto;padding:38px 44px 56px}
.inner{max-width:1060px;margin:0 auto}
.banner{display:flex;align-items:center;gap:12px;margin:16px 20px 0;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--fg-2)}
.banner b{color:var(--fg)}
.banner.gold{border-color:var(--accent-line);background:var(--accent-soft)}
.banner.warn{border-color:color-mix(in srgb, var(--p-high) 45%, var(--line))}
.banner .btn{margin-left:auto;flex:none;height:36px}
.banner .x{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg-2);flex:none}
.vhead{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px}
.vhead .ttl{flex:1;min-width:0}
.vhead h1{font-size:40px;font-weight:700;line-height:1.05}
.vhead .sub{color:var(--fg-2);font-size:15px;margin-top:10px}
.sq-btn{width:46px;height:46px;border-radius:13px;background:var(--card);display:grid;place-items:center;color:var(--fg-2);flex:none}
.sq-btn:hover{background:var(--hover);color:var(--fg)}
.sq-btn.on{color:var(--accent-text)}
.menu-btn{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 20px;border-radius:13px;font-weight:600;font-size:14.5px;background:var(--card);color:var(--fg);border:1px solid var(--line-2);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{background:var(--p-high);color:#140808;border-color:transparent}
.btn .i{width:17px;height:17px}
.danger-text{color:var(--p-high)!important}

/* Schnell-Eingabe */
.qa{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 8px 8px 22px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:border-color .15s}
.qa:focus-within{border-color:var(--accent-line)}
.qa > .i{color:var(--accent-text);width:22px;height:22px}
.qa input{flex:1;min-width:0;height:46px;font-size:16px}
.qa .btn{height:48px;padding:0 22px;font-size:15px}
.qa-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qa-opts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.seg.sm{padding:3px;border-radius:12px}
.seg.sm button{height:34px;padding:0 10px;font-size:13.5px;border-radius:9px;display:inline-flex;align-items:center;gap:7px}
.seg.sm button .i{width:15px;height:15px}
.qa-type button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.qa-f{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--fg-2);font-size:13.5px}
.qa-f:focus-within{border-color:var(--accent-line)}
.qa-f .i{width:16px;height:16px;color:var(--accent-text)}
.qa-f input{height:36px;font-size:14px;color:var(--fg);color-scheme:inherit}
.qa-f input[type=date]{width:120px} .qa-f input[type=time]{width:80px}
.qa-f.has{border-color:var(--accent-line);background:var(--accent-soft)}
.qa-dash{font-size:13px;color:var(--fg-3)}
.qa-reset{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--fg-2)}
.qa-reset:hover{background:var(--hover);color:var(--fg)}
.chip.ev,.plan-ev.ev{box-shadow:inset 3px 0 0 var(--c);font-weight:600}
.chip.cont{border-radius:0 7px 7px 0;opacity:.85}
.hm-task.ev{cursor:pointer}
.chk.ev{border:0;color:var(--accent-text);background:var(--accent-soft)}
.chk.ev .i{width:14px;height:14px;stroke-width:2}
/* Personen */
.pp{display:inline-flex;gap:3px;flex:none;vertical-align:1px}
.pp i{font-style:normal;display:inline-grid;place-items:center;min-width:24px;height:19px;padding:0 5px;border-radius:10px;font-size:10.5px;font-weight:700;letter-spacing:.02em;line-height:1;color:color-mix(in srgb, var(--c) 80%, var(--fg));background:color-mix(in srgb, var(--c) 20%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent)}
.chip .pp,.plan-ev .pp{margin-right:4px}
.chip .pp i,.plan-ev .pp i{min-width:0;height:15px;padding:0 3px;font-size:9.5px;border-radius:4px}
.av.sm{width:20px;height:20px;font-size:8.5px;letter-spacing:0}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#140f08;background:var(--c, var(--fg-3));flex:none}
.person-pick{display:flex;flex-wrap:wrap;gap:6px}
.person-pick button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 4px;border-radius:17px;background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--fg-2)}
.person-pick button .av{opacity:.55}
.person-pick button[aria-pressed="true"]{border-color:var(--c);color:var(--fg);background:color-mix(in srgb, var(--c) 16%, var(--card))}
.person-pick button[aria-pressed="true"] .av{opacity:1}
.person-pick .pp-more{padding:0 12px;color:var(--accent-text)}
.ctx-people{display:flex;flex-wrap:wrap;gap:4px;padding:2px 2px 6px}
.ctx-people button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 3px;border-radius:16px;background:var(--card);font-size:12.5px;color:var(--fg-2)}
.ctx-people button .av{width:26px;height:26px;opacity:.55}
.ctx-people button.on{color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--c)}
.ctx-people button.on .av{opacity:1}
.pp-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pp-row .av{width:36px;height:36px;font-size:12.5px;cursor:pointer}
.pp-row input{height:40px;padding:0 12px;border-radius:11px;background:var(--card);border:1px solid var(--line);min-width:0}
.pp-row input:focus{border-color:var(--accent-line)}
.pp-row .nm{flex:1}
.pp-row .sh{width:70px;text-align:center;text-transform:uppercase;font-weight:700}
.pp-row .del{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg-3)}
.pp-row .del:hover{background:var(--hover);color:var(--p-high)}
.pp-add{display:flex;gap:8px;margin-top:14px}
.pp-add input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.as-filter{margin:4px 0 10px}
.as-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.as-row .t{flex:1;min-width:0}
.as-row .t b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-row .t small{font-size:12.5px;color:var(--fg-2)}
.as-row .t small.late{color:var(--p-high)}
.as-pp{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;flex:none;max-width:55%}
.as-pp button{min-width:36px;height:30px;padding:0 6px;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--fg-3);background:var(--card);border:1px solid var(--line)}
.as-pp button:hover{color:var(--fg)}
.as-pp button[aria-pressed="true"]{color:#140f08;background:var(--c);border-color:var(--c)}
.hm-pad{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px}
.hm-pad p{margin:0;color:var(--fg-2);font-size:14.5px;line-height:1.5}
.hm-pad .btn{align-self:flex-start}
.hm-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;padding:0 20px 20px}
.hm-person{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:var(--card-2);text-align:left;min-width:0}
.hm-person:hover{background:var(--hover)}
.hm-person .av{width:36px;height:36px;font-size:12.5px}
.hm-person.none .av{background:var(--line-2);color:var(--fg-2)}
.hm-person .pn{min-width:0}
.hm-person b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-person small{font-size:12.5px;color:var(--fg-2)}
/* Große Woche in der Übersicht */
.wk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.wk-col{min-height:200px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.wk-col:first-child{border-left:0}
.wk-col.we{background:color-mix(in srgb, var(--accent) 4%, transparent)}
.wk-col.today{background:color-mix(in srgb, var(--accent) 10%, transparent)}
.wk-col.drop-over{background:var(--accent-soft)}
.wk-col.past .wk-items{opacity:.55}
.wk-col:last-child{border-radius:0 0 18px 0} .wk-col:first-child{border-radius:0 0 0 18px}
.wk-h{display:flex;align-items:baseline;gap:7px;padding:11px 12px 7px;text-align:left}
.wk-h small{font-size:12px;color:var(--fg-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wk-h b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.wk-h:hover b{color:var(--accent-text)}
.wk-col.we .wk-h b{color:var(--fg-2)} .wk-col.hol .wk-h b{color:var(--p-high)}
.wk-col.today .wk-h b,.wk-col.today .wk-h small{color:var(--accent-text)}
.wk-items{display:flex;flex-direction:column;gap:4px;padding:0 7px 10px;min-width:0}
.wk-it{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;hyphens:auto;padding:5px 8px;border-radius:8px;font-size:12.5px;line-height:1.3;cursor:pointer;background:color-mix(in srgb, var(--c) 15%, var(--card));min-width:0}
.wk-it:hover{background:color-mix(in srgb, var(--c) 26%, var(--card))}
.wk-it.ev{box-shadow:inset 3px 0 0 var(--c);font-weight:600}
.wk-it.done{opacity:.5} .wk-it.done span{text-decoration:line-through}
.wk-it em{font-style:normal;font-weight:700;color:color-mix(in srgb, var(--c) 70%, var(--fg));font-variant-numeric:tabular-nums;margin-right:5px}

.wk-it .pp{margin-left:5px;vertical-align:0}
.wk-it .pp i{min-width:0;height:15px;padding:0 4px;font-size:9.5px}
.wk-hol{font-size:11.5px;font-weight:600;color:var(--p-high);padding:0 4px 2px}
.wk-more{font-size:12px;color:var(--accent-text);text-align:left;padding:2px 6px}
.wk-compact{display:none}
.qa-chips:empty{display:none}
.pchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);font-size:12.5px;font-weight:600}
.pchip .i{width:13px;height:13px}
.qcard{margin-top:44px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 24px}
.qcard-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
.qcard-h b{font-size:15.5px;font-weight:600}
.qcard-h span{font-size:13px;color:var(--fg-2)}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qtile{background:var(--card-2);border-radius:12px;padding:11px 16px}
.qtile code{display:block;font-family:var(--font-mono);font-size:13.5px;color:var(--accent-text)}
.qtile span{font-size:13.5px;color:var(--fg-2)}

/* Aufgaben */
.group{margin-top:26px}
.ghead{display:flex;align-items:center;gap:7px;width:100%;padding:0 4px 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.ghead .chev{width:14px;height:14px;transition:transform .15s}
.ghead[aria-expanded="true"] .chev{transform:rotate(90deg)}
.ghead .gcount{color:var(--fg-3);font-weight:500}
.ghead.late{color:var(--p-high)}
.gbody{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:14px;padding:13px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer;outline-offset:-2px;transition:border-color .12s,background .12s}
.task:hover{background:var(--card-2);border-color:var(--line-2)}
.task.is-sel{border-color:var(--accent-line)}
.task.dragging{opacity:.45}
.p3{--pc:var(--p-high)} .p2{--pc:var(--p-med)} .p1{--pc:var(--p-low)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--pc, var(--fg-3));display:grid;place-items:center;flex:none;color:transparent;transition:background .12s}
.chk .i{width:13px;height:13px;stroke-width:3}
.chk:hover{background:color-mix(in srgb, var(--pc, var(--fg-3)) 20%, transparent);color:var(--pc, var(--fg-2))}
.is-done .chk,.chk.on{background:var(--fg-3);border-color:var(--fg-3);color:var(--panel)}
.chk.ghost{border:0;background:none;color:var(--fg-3)}
.chk.ghost .i{width:17px;height:17px;stroke-width:1.8}
.task-body{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.is-done .task-title{text-decoration:line-through;color:var(--fg-3)}
.task-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:3px;font-size:12.5px;color:var(--fg-2)}
.task-meta:empty{display:none}
.m{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.m .i{width:13px;height:13px}
.m.lst i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.task-when{flex:none;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.task-when.late{color:var(--p-high)}
.task-when.today{color:var(--accent-text)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;color:color-mix(in srgb, var(--c) 75%, var(--fg));background:color-mix(in srgb, var(--c) 20%, transparent)}
.skel{height:52px;border-radius:14px;background:linear-gradient(90deg,var(--card) 0%,var(--card-2) 50%,var(--card) 100%);background-size:200% 100%;animation:shimmer 1.3s infinite linear;margin-bottom:8px}
@keyframes shimmer{to{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 16px 8px}
.rings{position:relative;width:168px;height:168px;display:grid;place-items:center;margin-bottom:22px}
.rings::before,.rings::after{content:"";position:absolute;border-radius:50%;border:1px solid var(--line-2)}
.rings::before{inset:0} .rings::after{inset:22px}
.rings span{width:82px;height:82px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.rings .i{width:32px;height:32px}
.empty h2{font-size:28px;font-weight:700;margin-bottom:10px}
.empty p{margin:0;max-width:46ch;color:var(--fg-2);font-size:16px;line-height:1.55}
.empty-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}

/* Details */
.detail{width:var(--detail);flex:none;display:none;flex-direction:column;min-height:0;overflow:hidden}
.detail.open{display:flex}
.d-head{display:flex;align-items:center;gap:12px;padding:16px 16px 14px 20px;border-bottom:1px solid var(--line)}
.d-head .chk{width:24px;height:24px}
.d-when{flex:1;min-width:0;font-size:13.5px;font-weight:500;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-when.late{color:var(--p-high)}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--fg-2);flex:none;background:var(--card)}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.d-scroll{flex:1;overflow-y:auto;padding:18px 20px 24px}
.d-title{width:100%;resize:none;font-family:var(--font-head);font-weight:700;font-size:22px;line-height:1.25;padding:2px 0;overflow:hidden}
.d-props{display:flex;flex-direction:column;gap:4px;margin:14px 0 6px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.prop{display:grid;grid-template-columns:116px minmax(0,1fr);align-items:center;gap:8px;min-height:40px}
.prop-l{display:flex;align-items:center;gap:8px;color:var(--fg-2);font-size:13.5px}
.prop-l .i{width:16px;height:16px}
.prop-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.field{height:34px;padding:0 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13.5px;min-width:0}
.field:focus{border-color:var(--accent-line)}
.field:disabled{opacity:.45}
select.field{padding-right:4px;max-width:100%}
.qd{display:flex;flex-wrap:wrap;gap:6px}
.qd button{height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:500;background:var(--card);color:var(--fg-2)}
.qd button:hover{color:var(--fg);background:var(--hover)}
.prio-seg{display:flex;flex-wrap:wrap;gap:5px}
.prio-seg button{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:10px;color:var(--pc, var(--fg-2));font-size:12.5px;font-weight:600;background:var(--card)}
.prio-seg button[aria-pressed="true"]{background:color-mix(in srgb, var(--pc, var(--fg-3)) 22%, var(--card));box-shadow:inset 0 0 0 1.5px var(--pc, var(--fg-3))}
.prio-seg .i{width:14px;height:14px}
.tags-edit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tags-edit .tag{gap:3px;padding-right:3px}
.tags-edit .tag button{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:inherit}
.tags-edit .tag .i{width:11px;height:11px;stroke-width:2.4}
.tags-edit input{height:28px;min-width:90px;flex:1;font-size:13.5px}
.d-sec{margin-top:18px}
.d-sec-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2);margin-bottom:8px}
.prog{height:4px;border-radius:3px;background:var(--card-2);overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.sub{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 6px;border-radius:10px}
.sub:hover{background:var(--card)}
.sub .chk{width:19px;height:19px}
.sub input{flex:1;min-width:0;height:36px}
.sub.done input{text-decoration:line-through;color:var(--fg-3)}
.sub .del{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--fg-3);opacity:0}
.sub:hover .del,.sub:focus-within .del{opacity:1}
@media (hover:none){ .sub .del{opacity:1} }
.sub.add{color:var(--fg-2)}
.d-notes{width:100%;min-height:130px;resize:none;line-height:1.55;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.d-foot{display:flex;align-items:center;gap:8px;padding:12px 14px 12px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg-2)}
/* Große Ansicht: mittig über der Seite, Notizen links breit, Eigenschaften rechts */
body.detail-big .detail{position:fixed;top:max(20px, 3.5vh);bottom:max(20px, 3.5vh);left:50%;right:auto;width:min(1120px, calc(100% - 48px));transform:translateX(-50%);z-index:40;box-shadow:var(--shadow);display:none;visibility:visible;transition:none;margin:0}
body.detail-big .detail.open{display:flex;transform:translateX(-50%)}
body.detail-big.detail-open .scrim{opacity:1;pointer-events:auto}
body.detail-big .d-head{padding:16px 18px 14px 28px}
@media (min-width:860px){
  body.detail-big .d-scroll{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px, 430px);grid-template-rows:auto auto auto 1fr;grid-template-areas:"trash trash" "title props" "notes props" "subs props";column-gap:36px;align-items:start;padding:22px 28px 28px}
  body.detail-big .d-trash{grid-area:trash}
  body.detail-big .d-title{grid-area:title;font-size:26px}
  body.detail-big .d-props{grid-area:props;margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb, var(--card) 45%, transparent)}
  body.detail-big .d-props .prop{grid-template-columns:104px minmax(0,1fr)}
  body.detail-big .d-notes-sec{grid-area:notes}
  body.detail-big .d-subs{grid-area:subs}
  body.detail-big .d-notes{min-height:min(46vh, 420px);font-size:15px;padding:14px 16px}
}
.trash-note{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb, var(--p-high) 12%, var(--card));margin-bottom:14px;font-size:13.5px}

/* Kalender */
.cal-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:24px}
.cal-bar h1{font-size:40px;font-weight:700;margin-right:auto;line-height:1.1}
.cal-bar h1 span{color:var(--fg-2);font-weight:500}
.seg{display:inline-flex;padding:5px;border-radius:15px;background:var(--card);gap:2px}
.seg button{height:38px;padding:0 18px;border-radius:11px;font-weight:600;font-size:14px;color:var(--fg-2)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--fg)}
.seg.accent button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1}
.cal-grid{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}
.cal-h{padding:14px 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);border-bottom:1px solid var(--line)}
.cal-h.kw{text-align:center;padding-inline:0}
.kw{font-size:12.5px;color:var(--fg-3);text-align:center;padding-top:18px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.cal-grid > .kw:nth-child(9){border-top:0}
.cell{min-height:118px;padding:10px 10px 8px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0;transition:background .12s}
.cell:hover{background:var(--card-2)}
.cell.out{background:var(--panel)}
.cell.out .cell-n{color:var(--fg-3);font-weight:500}
.cell.sel:not(.today){box-shadow:inset 0 0 0 1.5px var(--line-2)}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb, var(--accent) 7%, var(--card))}
.cell-n{font-family:var(--font-head);font-size:16.5px;font-weight:600;line-height:28px;min-width:28px;font-variant-numeric:tabular-nums}
.cell.today .cell-n{width:30px;height:30px;line-height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);text-align:center;font-size:15px}
.cal-h.we{color:var(--accent-text)}
.cal-grid .cell,.cal-grid > .kw{border-color:var(--line-2)}
.cell.we{background:color-mix(in srgb, var(--accent) 7%, var(--card));border-color:color-mix(in srgb, var(--accent) 30%, var(--line-2))}
.cell.we + .cell.we{border-left-color:color-mix(in srgb, var(--accent) 38%, var(--line-2))}
.cell.hol{border-color:color-mix(in srgb, var(--p-high) 32%, var(--line-2))}
.cal-h.we{border-bottom-color:color-mix(in srgb, var(--accent) 30%, var(--line-2))}
.cal-h{border-bottom-color:var(--line-2)!important}
.cell.we.out{background:color-mix(in srgb, var(--accent) 5%, var(--panel))}
.cell.we:hover{background:color-mix(in srgb, var(--accent) 12%, var(--card))}
.cell.we:not(.today) .cell-n{color:var(--accent-text)}
.cell.hol{background:color-mix(in srgb, var(--p-high) 11%, var(--card))}
.cell.hol.out{background:color-mix(in srgb, var(--p-high) 7%, var(--panel))}
.cell.hol:hover{background:color-mix(in srgb, var(--p-high) 16%, var(--card))}
.cell.hol:not(.today) .cell-n{color:var(--p-high)}
.cell.out.we .cell-n,.cell.out.hol .cell-n{opacity:.7}
.hol-name{font-size:11.5px;font-weight:600;line-height:1.3;color:var(--p-high);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.hol-name.big{font-size:13px;margin-top:6px;white-space:normal}
.wcol.we{background:color-mix(in srgb, var(--accent) 7%, var(--card));border-color:color-mix(in srgb, var(--accent) 35%, var(--line-2))}
.wcol.we:not(.today) .whead b,.wcol.we .whead span{color:var(--accent-text)}
.wcol.hol{background:color-mix(in srgb, var(--p-high) 11%, var(--card))}
.wcol.hol:not(.today) .whead b,.wcol.hol .whead span{color:var(--p-high)}
.wcol .hol-name{padding:0 4px 6px;margin-top:-6px;white-space:normal}
.chip{display:block;font-size:12.5px;line-height:1.35;padding:4px 9px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:color-mix(in srgb, var(--c) 72%, var(--fg));background:color-mix(in srgb, var(--c) 20%, var(--card))}
.chip.done{opacity:.5;text-decoration:line-through}
.more{font-size:12px;color:var(--fg-2);padding-left:4px}
.dots{display:none;gap:3px;justify-content:center;flex-wrap:wrap}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c, var(--fg-3))}
.drop-over{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 2px var(--accent)!important}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wcol{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:360px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol.today{border-color:var(--accent)}
.whead{display:flex;align-items:baseline;gap:8px;padding:4px 4px 10px;cursor:pointer}
.whead b{font-family:var(--font-head);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.whead span{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.wcol.today .whead b{color:var(--accent-text)}
.wcol .chip{white-space:normal;padding:6px 9px}
.wempty{font-size:12.5px;color:var(--fg-3);padding:0 4px}

/* Matrix */
.matrix{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(300px,1fr);gap:18px;min-height:calc(100% - 80px)}
.quad{--qc:var(--fg-2);display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.quad.q3{--qc:var(--p-high)} .quad.q2{--qc:var(--p-med)} .quad.q1{--qc:var(--p-low)}
.quad header{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.qn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--qc);background:color-mix(in srgb, var(--qc) 18%, transparent);flex:none}
.quad h3{font-size:17px;font-weight:700;color:var(--qc);letter-spacing:-.01em}
.quad .qhint{font-size:13px;color:var(--fg-2)}
.qcount{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.qlist{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.qlist .task{background:var(--card-2);padding:12px 16px}
.qdrop{flex:1;min-height:120px;border:1.5px dashed var(--line-2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--fg-2);font-size:14px;text-align:center;padding:16px}
.qdrop .i{width:20px;height:20px}
.qadd{display:flex;align-items:center;gap:10px;padding:0 20px;min-height:58px;border-top:1px solid var(--line);color:var(--fg-2)}
.qadd input{flex:1;min-width:0;height:56px;color:var(--fg);font-size:14.5px}
.qadd input::placeholder{color:var(--fg-2)}

/* Fokus */
.focus{max-width:640px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{position:relative;width:min(320px, 76vw);aspect-ratio:1;max-width:100%;margin:30px 0 26px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none}
.ring .outer{stroke:var(--line);stroke-width:1.2}
.ring .bg{stroke:var(--card-2);stroke-width:11}
.ring .fg{stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-label{font-family:var(--font-head);font-weight:700;font-size:clamp(52px, 14vw, 76px);font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.t-sub{font-size:14.5px;color:var(--fg-2);margin-top:10px}
.rounds{display:flex;gap:6px;margin-top:10px}
.rounds i{width:22px;height:5px;border-radius:3px;background:var(--line-2)}
.rounds i.on{background:var(--accent)}
.f-task{position:relative;display:flex;align-items:center;gap:12px;width:min(470px,100%);height:58px;padding:0 18px;border-radius:15px;background:var(--card);border:1px solid var(--line);margin-bottom:18px;text-align:left}
.f-task select{flex:1;min-width:0;height:100%;appearance:none;-webkit-appearance:none;font-size:15px;font-weight:500;cursor:pointer;padding-right:26px}
.f-task select option{background:var(--panel);color:var(--fg)}
.f-task .chev-d{position:absolute;right:18px;pointer-events:none;color:var(--fg-2)}
.f-ctrl{display:flex;gap:12px;align-items:center}
.f-ctrl .btn.primary{height:56px;min-width:200px;border-radius:15px;font-size:17px}
.f-ctrl .sq-btn{width:56px;height:56px;border-radius:15px}
.f-stats{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:40px}

.lv-minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}

.lv-su div small{margin-left:auto;font-size:12.5px;color:var(--fg-2);white-space:nowrap}
.lv-tile.f{background:color-mix(in srgb, #4FB8A9 16%, var(--card));color:color-mix(in srgb, #4FB8A9 85%, var(--fg))}
.lv-tile.s{background:color-mix(in srgb, #B48CF0 16%, var(--card));color:color-mix(in srgb, #B48CF0 85%, var(--fg))}

.lv-table > header .btn{height:36px}
.lv-side .yr .sq-btn:disabled{opacity:.3;pointer-events:none}
.lv-seg{flex-wrap:wrap}
.lv-seg.lv-acc{margin-top:0}

.modal.wide{width:min(1000px,100%)}

.lvb-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
.lvb-yr{display:flex;align-items:center;gap:10px}

@media (max-width:639px){ .lvb-bar .seg{margin-left:0;width:100%} .lvb-bar .seg button{flex:1;padding:0 6px} .modal.wide .m-head .btn span{display:none} .modal.wide .m-head .btn{width:38px;padding:0;justify-content:center} }
.lv-table{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.lv-table > header{display:flex;align-items:center;gap:12px;padding:16px 18px 16px 24px;border-bottom:1px solid var(--line)}
.lv-table > header b{font-family:var(--font-head);font-size:18px;font-weight:700}
.lv-table .seg{background:var(--card-2)}
.lv-table .seg button{height:34px;padding:0 14px;font-size:13.5px}
.lv-thead,.lv-row{display:grid;grid-template-columns:120px 150px minmax(0,1fr) 100px 90px;align-items:center;gap:12px;padding:0 24px}
.lv-thead{height:44px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2);border-bottom:1px solid var(--line)}
.lv-thead .r,.lv-row .c-amt,.lv-row .c-sal{text-align:right}
.lv-row{width:100%;min-height:66px;padding-block:10px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lv-row:last-child{border-bottom:0}
.lv-row:hover{background:var(--card-2)}
.lv-row.plan{background:repeating-linear-gradient(135deg, transparent 0 10px, color-mix(in srgb, var(--fg) 3.5%, transparent) 10px 20px)}
.lv-row.plan:hover{background-color:var(--card-2)}
.c-date{color:var(--fg-2);font-size:14.5px}
.lv-row.plan .c-date,.lv-row.plan .c-desc b{color:var(--fg-2)}
.c-desc{min-width:0}
.c-desc b{display:block;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-desc small{display:block;font-size:13px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-amt{font-weight:700;font-size:15px}
.c-sal{color:var(--fg-2);font-size:14.5px}
.lbadge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;color:color-mix(in srgb, var(--c) 78%, var(--fg));background:color-mix(in srgb, var(--c) 18%, transparent)}
.lv-empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:40px 20px;color:var(--fg-2)}
.lv-empty > .i{width:28px;height:28px;color:var(--accent-text);margin-bottom:6px}
.lv-empty b{color:var(--fg);font-size:16px}
.lv-side .yr{display:flex;align-items:center;justify-content:space-between}
.lv-side .yr b{font-family:var(--font-head);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.lv-side .yr .sq-btn{width:40px;height:40px;border-radius:11px;background:var(--card-2)}
.lv-side .btn{width:100%;justify-content:flex-start;height:48px}
.btn.ue{background:transparent;border-color:var(--line-2)}
.btn.ue .i{color:var(--ue)}
.lv-next{text-align:left;gap:6px}
.lv-next b{font-size:15.5px;font-weight:600}
.lv-next span:not(.side-label span){font-size:13.5px;color:var(--fg-2)}
.lv-next em{font-style:normal;font-size:13.5px;color:var(--accent-text);font-weight:600}
.lv-next:hover{border-color:var(--accent-line)}
.lchip{display:block;font-size:12px;font-weight:600;line-height:1.35;padding:3px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:color-mix(in srgb, var(--c) 78%, var(--fg));background:color-mix(in srgb, var(--c) 16%, transparent);box-shadow:inset 3px 0 0 var(--c)}
.wcol .lchip{white-space:normal}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld input:not([type=radio]):not([type=checkbox]),.fld select{height:44px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:0;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--accent-line)}
.fld select option{background:var(--panel);color:var(--fg)}
.chkline{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;cursor:pointer}
.chkline input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.chkline.sm{margin-top:10px;font-size:13.5px;color:var(--fg-2)}
/* Notiz direkt unter der Aufgabe */
.t-note{margin-top:6px;padding:2px 0 2px 10px;border-left:2px solid var(--accent-line);font-size:13px;line-height:1.45;color:var(--fg-2);white-space:pre-line;overflow-wrap:anywhere;font-weight:400}
.is-done .t-note{opacity:.6}
.hm-task:has(.t-note){align-items:flex-start}
.hm-task:has(.t-note) .chk,.hm-task:has(.t-note) .rt{margin-top:2px}
.task:has(.t-note){align-items:flex-start}
.task:has(.t-note) > .chk{margin-top:1px}
.hint{font-size:13px;color:var(--fg-2);margin:10px 0 0}
.hint code,.keys kbd{font-family:var(--font-mono);font-size:12px;background:var(--card-2);padding:1px 6px;border-radius:5px;color:var(--accent-text)}
.lv-seg{margin-top:6px}
.lv-seg button{padding:0 8px;font-size:13.5px}
.wd-pick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd-pick button{height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;color:var(--fg-2)}
.wd-pick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* Schulferien */
.cell.fer{background-image:linear-gradient(to bottom, color-mix(in srgb, #3CC0C0 75%, transparent) 0 3px, transparent 3px)}
.wcol.fer{box-shadow:inset 0 3px 0 #3CC0C0}
.bchip{display:flex;align-items:center;gap:5px;min-width:0;padding:2px 7px;margin-bottom:3px;border-radius:7px;font-size:11.5px;font-weight:600;line-height:1.45;cursor:pointer;color:color-mix(in srgb, #FF8A5B 80%, var(--fg));background:color-mix(in srgb, #FF8A5B 15%, transparent)}
.bchip .i{width:13px;height:13px;flex:none}
.bchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-side{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.bd-side button{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;text-align:left;min-width:0}
.bd-side button:hover{background:var(--hover)}
.bd-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;color:#FF8A5B;background:color-mix(in srgb, #FF8A5B 15%, transparent)}
.bd-ic .i{width:15px;height:15px}
.bd-n{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-side em{font-style:normal;font-size:12px;color:var(--fg-2);white-space:nowrap}
.side-label .hm-link{width:auto;height:28px;padding:0 8px;margin-left:auto;margin-right:-8px;display:inline-flex;align-items:center;flex:none;white-space:nowrap;letter-spacing:0;text-transform:none;font-size:13px;color:var(--accent-text)}
.bd-add{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:8px}
.bd-add input{height:44px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.bd-add input:focus{border-color:var(--accent-line)}
.bd-add .btn{height:44px}
.bd-list{display:flex;flex-direction:column;gap:2px;margin-top:14px;max-height:min(42vh,380px);overflow-y:auto}
.bd-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px}
.bd-row:hover{background:var(--card)}
.bd-row > div{flex:1;min-width:0}
.bd-row b{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-row small{display:block;font-size:12.5px;color:var(--fg-2)}
.bd-row .icon-btn{width:34px;height:34px;background:transparent;color:var(--fg-3)}
.bd-row .icon-btn:hover{color:var(--p-high)}
.bd-import{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.bd-import summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent-text)}
.bd-import textarea{width:100%;margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);resize:vertical;line-height:1.5;font-size:14px}
.hm-bd{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:8px;border-radius:12px;text-align:left;font-weight:600;color:color-mix(in srgb, #FF8A5B 85%, var(--fg));background:color-mix(in srgb, #FF8A5B 12%, transparent)}
.hm-bd .i{width:18px;height:18px;flex:none}

@media (max-width:639px){ .bd-add{grid-template-columns:1fr 1fr} .bd-add .btn{grid-column:1 / -1} .cell .bchip{display:none} }
.fer-name{font-size:11px;font-weight:600;color:color-mix(in srgb, #3CC0C0 70%, var(--fg));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fer-name.big{font-size:13px;margin-top:4px}

/* Kontextmenü */
.ctx{position:fixed;z-index:90;width:268px;max-height:calc(100% - 16px);overflow-y:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:2px;animation:ctxIn .12s ease-out}
@keyframes ctxIn{from{opacity:0;transform:scale(.97)}}
.ctx.sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom, 0px));width:auto;max-height:75%;border-radius:20px;animation:sheetIn .18s ease-out}
@keyframes sheetIn{from{transform:translateY(30px);opacity:0}}
.ctx-h{padding:6px 10px 8px;font-weight:600;font-size:13.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:2px 2px 6px}
.ctx-row button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;font-size:11.5px;color:var(--fg-2);background:var(--card)}
.ctx-row button:hover{background:var(--hover);color:var(--fg)}
.ctx-row.prio button{color:var(--pc, var(--fg-2))}
.ctx-row.prio button.on{box-shadow:inset 0 0 0 1.5px var(--pc, var(--fg-3))}
.ctx-row .i{width:17px;height:17px}
.ctx-i{display:flex;align-items:center;gap:11px;height:40px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:500;text-align:left}
.ctx-i:hover,.ctx-lists button:hover{background:var(--hover)}
.ctx-i .i{width:17px;height:17px;color:var(--fg-2)}
.ctx-i.danger-text .i{color:var(--p-high)}
.ctx-sub{padding:8px 10px 2px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.ctx-lists{display:flex;flex-direction:column;max-height:160px;overflow-y:auto}
.ctx-lists button{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:9px;font-size:13.5px;text-align:left}
.ctx-lists button.on{color:var(--accent-text);font-weight:600}
.ctx-lists .i{width:15px;height:15px}
.ctx-lists .ldot{margin:0 3px}

/* Ziehen, Wischen */
[data-drag-task],[data-drag-list],.task,.chip,.mini-task{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag-ghost{position:fixed;left:0;top:0;z-index:95;pointer-events:none;opacity:.92;box-shadow:var(--shadow);transform-origin:0 0;border-radius:12px;background:var(--card-2)!important}
.dragging{opacity:.4}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
.pressed{transform:scale(.98);background:var(--hover)!important;transition:transform .12s}
.nav-item.drop-over{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 2px var(--accent)}
.task{transition:border-color .12s,background .12s,transform .18s}
.task.sw-r{background:color-mix(in srgb, var(--ok) 18%, var(--card));border-color:var(--ok-line)}
.task.sw-l{background:color-mix(in srgb, var(--p-low) 18%, var(--card));border-color:color-mix(in srgb, var(--p-low) 50%, var(--line))}

/* Gruppen-Aktion, Sync-Punkt am Menü */
.ghead-row{display:flex;align-items:center;gap:8px}
.ghead-row .ghead{flex:1}
.g-act{height:26px;padding:0 10px;margin-bottom:10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);white-space:nowrap}
.menu-btn{position:relative}
.menu-btn .sdot{position:absolute;top:8px;right:8px;width:9px;height:9px;border:2px solid var(--card);box-sizing:content-box}

/* Notiz-Links, Detail-Erweiterungen */
.d-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.d-links button{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:28px;padding:0 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);font-size:12.5px;font-weight:500}
.d-links button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-links .i{width:13px;height:13px}

/* Filter-Hilfe, Suche */

<script>
(() => {
'use strict';

/* ---------- Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const ic = (n, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

/* ---------- Datum ---------- */
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const todayKey = () => dkey(new Date());
const diffDays = (a, b) => Math.round((parseKey(a) - parseKey(b)) / 864e5);
const WD = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WDS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONS = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }
function startOfWeek(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); }
const shortDate = d => `${d.getDate()}. ${MONS[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`;
const longDate = d => `${WD[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}`;
function relLabel(k) {
  const n = diffDays(k, todayKey());
  if (n === 0) return 'Heute'; if (n === 1) return 'Morgen'; if (n === -1) return 'Gestern'; if (n === 2) return 'Übermorgen';
  const d = parseKey(k);
  if (n > 2 && n < 7) return WD[d.getDay()];
  return shortDate(d);
}
function nextDue(k, rep, day) {
  let d = parseKey(k); day = day || d.getDate();
  const clampDay = (y, m, dd) => new Date(y, m, Math.min(dd, new Date(y, m + 1, 0).getDate()));
  if (rep && rep.startsWith('every:')) {
    const [, n, u] = rep.split(':'); const N = Math.max(1, +n || 1);
    d = u === 'd' ? addDays(d, N) : u === 'w' ? addDays(d, 7 * N) : u === 'm' ? clampDay(d.getFullYear(), d.getMonth() + N, day) : clampDay(d.getFullYear() + N, d.getMonth(), day);
    return dkey(d);
  }
  if (rep && rep.startsWith('wd:')) { const set = rep.slice(3).split(',').map(Number).filter(x => x >= 0 && x < 7); if (!set.length) return dkey(addDays(d, 7)); do { d = addDays(d, 1); } while (!set.includes(d.getDay())); return dkey(d); }
  if (rep && rep.startsWith('lastwd:')) { const w = +rep.slice(7); const lastOf = (y, m) => { let x = new Date(y, m + 1, 0); while (x.getDay() !== w) x = addDays(x, -1); return x; }; let x = lastOf(d.getFullYear(), d.getMonth()); if (dkey(x) <= k) x = lastOf(d.getFullYear(), d.getMonth() + 1); return dkey(x); }
  switch (rep) {
    case 'daily': d = addDays(d, 1); break;
    case 'weekdays': do { d = addDays(d, 1); } while (d.getDay() === 0 || d.getDay() === 6); break;
    case 'weekly': d = addDays(d, 7); break;
    case 'monthly': d = clampDay(d.getFullYear(), d.getMonth() + 1, day); break;
    case 'yearly': d = clampDay(d.getFullYear() + 1, d.getMonth(), day); break;
  }
  return dkey(d);
}

/* ---------- Konstanten ---------- */
const PALETTE = ['#F5A524','#86C95A','#6CB4EE','#F07167','#B48CF0','#3CC0C0','#E879A9','#D9C23A','#C27A47','#9AA0A6'];
const PRIO_NAMES = {3: 'Hoch', 2: 'Mittel', 1: 'Niedrig', 0: 'Keine'};
const REPEAT = {'': 'Nie', daily: 'Täglich', weekdays: 'Werktags (Mo–Fr)', weekly: 'Wöchentlich', monthly: 'Monatlich', yearly: 'Jährlich'};
const SMART = [
  {id: 'inbox', name: 'Eingang', icon: 'inbox'},
  {id: 'today', name: 'Heute', icon: 'sun'},
  {id: 'tomorrow', name: 'Morgen', icon: 'sunrise'},
  {id: 'week', name: 'Nächste 7 Tage', icon: 'week'},
  {id: 'all', name: 'Alle Aufgaben', icon: 'all'}
];
const SMART2 = [{id: 'stats', name: 'Statistik', icon: 'chart'}, {id: 'completed', name: 'Erledigt', icon: 'done'}, {id: 'trash', name: 'Papierkorb', icon: 'trash'}];
const VIEWS = [
  {id: 'home', hash: 'uebersicht', name: 'Übersicht', icon: 'home'},
  {id: 'tasks', hash: 'aufgaben', name: 'Aufgaben', icon: 'tasks'},
  {id: 'calendar', hash: 'kalender', name: 'Kalender', icon: 'cal'},
  {id: 'leave', hash: 'urlaub', name: 'Urlaub & Überstunden', icon: 'case'}

/* ---------- Speicher & Synchronisierung über Google Drive ----------
   Jedes Gerät schreibt nur seine eigene Datei "geraet-<name>-<id>.json" in den Drive-Ordner "Arbeitsplaner".
   Beim Lesen werden alle Gerätedateien zusammengeführt: pro Eintrag gewinnt die neueste Änderung (updatedAt).
   Gelöschte Einträge bleiben dauerhaft als kleiner Grabstein erhalten, damit auch Geräte, die lange offline waren, die Löschung übernehmen. */

  if (!doc || typeof doc !== 'object' || !key.includes('/')) return false;

  return false;
}

  const maps = {}; for (const c of COLLS) maps[c] = new Map();

}

}

}

async function writeOwn() {
  const A = Sync.adapter;
  if (!A || !A.ready || !Sync.dirty || !Sync.ownFile) return;

  Sync.writing = true; Sync.dirty = false;
  try {
    const r = await A.write(Sync.ownFile, fileContent());
    if (r && r.version) Sync.known.set(Sync.ownFile, r.version);

      let data;
      try { data = JSON.parse(await A.read(f)); } catch (e) { console.warn('Datei unlesbar', f.name, e); failed = true; continue; }
      if (!data || data.format !== 1 || typeof data.docs !== 'object') { failed = true; continue; }
      for (const [k, d] of Object.entries(data.docs)) if (mergeDoc(k, d)) changed = true;
      Sync.known.set(f.name, f.version);
      Sync.devices.set(f.name, {name: data.deviceName || f.name, savedAt: data.savedAt || 0, own: f.name === Sync.ownFile});

/* --- Browser-Version (z. B. Dienstrechner ohne Installation): Anmeldung über Google Identity Services ---
   Der Zugriffs-Token gilt eine Stunde. Danach genügt ein Klick auf „Erneuern“; Änderungen bleiben solange lokal gespeichert. */
const WEB_CLIENT_ID = '735084055099-aua3ib6i5iqs3eioljg56nsmuo9cgaf0.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive';
function webAuth() {
  let gis = null;
  const err = (code, msg) => Object.assign(new Error(msg), {code});
  const load = () => gis || (gis = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => res(); s.onerror = () => { gis = null; rej(err('OFFLINE', 'Google-Anmeldung nicht erreichbar.')); };
    document.head.appendChild(s);

    preload() { if (WEB_CLIENT_ID) load().catch(() => {}); },
    granted() { return !!ls.get('ap.webGranted', false); },
    async getToken(interactive) {
      const s = ls.get('ap.webToken', null);
      if (s && s.token && s.exp - Date.now() > 120e3) return {accessToken: s.token, expiresAt: s.exp};
      if (!interactive) throw err('NEED_CONSENT', this.granted() ? 'Google-Verbindung abgelaufen.' : 'Noch nicht mit Google Drive verbunden.');
      if (!WEB_CLIENT_ID) throw err('CANCELED', 'Für die Browser-Version fehlt noch die Google-Client-ID.');
      await load();
      return new Promise((res, rej) => {
        const o2 = window.google.accounts.oauth2;
        const tc = o2.initTokenClient({
          client_id: WEB_CLIENT_ID, scope: DRIVE_SCOPE,
          callback: r => {
            if (!r || r.error || !r.access_token) return rej(err('CANCELED', (r && (r.error_description || r.error)) || 'Anmeldung abgebrochen.'));
            if (!o2.hasGrantedAllScopes(r, DRIVE_SCOPE)) return rej(err('CANCELED', 'Der Zugriff auf Google Drive wurde nicht erlaubt.'));
            const exp = Date.now() + (Number(r.expires_in) || 3600) * 1000;
            ls.set('ap.webToken', {token: r.access_token, exp}); ls.set('ap.webGranted', true);
            res({accessToken: r.access_token, expiresAt: exp});
          },
          error_callback: e => rej(err('CANCELED', e && e.type === 'popup_failed_to_open' ? 'Das Anmeldefenster wurde blockiert – bitte Pop-ups für diese Seite erlauben.' : 'Anmeldung abgebrochen.'))
        });

function streak(h) { const d = h.days || {}; let k = new Date(); if (!d[dkey(k)]) k = addDays(k, -1); let n = 0; while (d[dkey(k)]) { n++; k = addDays(k, -1); } return n; }

  else { const st = streak(h); sub = `<span class="${st ? '' : 'none'}">${st ? `Serie: ${st} ${st === 1 ? 'Tag' : 'Tage'}` : 'Noch keine Serie'}</span>`; }
  const name = `<b>${esc(h.name)}</b>${sub}`;

  if (!preview && S.habitMode === 'month') return `<div class="hrow month">${head}${habitMonth(h)}</div>`;
  return `<div class="hrow">${head}<div class="h-days">${days.map(d => {

/* ---------- Gespeicherte Filter (Suchsyntax) ---------- */
function compileFilter(q) {
  const td = todayKey(), tm = dkey(addDays(new Date(), 1)), wk = dkey(addDays(new Date(), 6));
  const tests = [], words = []; let done = false;
  const src = String(q || '').toLowerCase().replace(/ohne datum/g, 'ohnedatum');
  for (const w of src.split(/\s+/).filter(Boolean)) {
    if (w.length > 1 && w[0] === '@') { const n = w.slice(1); if (n === 'ohne' || n === 'niemand') tests.push(t => !taskPeople(t).length); else { const p = findPerson(n); tests.push(t => !!p && (t.people || []).includes(p.id)); } }
    else if (w.length > 1 && w[0] === '#') tests.push(t => (t.tags || []).some(g => g.toLowerCase() === w.slice(1)));
    else if (/^!(0|1|2|3)$/.test(w)) { const p = {0: 0, 1: 3, 2: 2, 3: 1}[w[1]]; tests.push(t => (t.priority || 0) === p); }
    else if (w.length > 1 && w[0] === '^') tests.push(t => { const l = listOf(t); return w === '^eingang' ? !l : !!l && l.name.toLowerCase().replace(/\s+/g, '').startsWith(w.slice(1)); });
    else if (w === 'überfällig' || w === 'ueberfaellig') tests.push(t => t.due && t.due < td);
    else if (w === 'heute') tests.push(t => t.due && t.due <= td);
    else if (w === 'morgen') tests.push(t => t.due === tm);
    else if (w === 'woche') tests.push(t => t.due && t.due <= wk);
    else if (w === 'ohnedatum') tests.push(t => !t.due);
    else if (w === 'wiederkehrend') tests.push(t => !!t.repeat);
    else if (w === 'erledigt') { done = true; tests.push(() => true); }
    else words.push(w);
  }
  const hay = t => [t.title, t.notes, ...(t.tags || []), ...(t.subtasks || []).map(s => s.title)].join(' ').toLowerCase();
  return {ops: tests.length > 0, done, fn: t => !!t.done === done && tests.every(f => f(t)) && words.every(x => hay(t).includes(x))};
}

function bdParse(line) {

  const d = +m[1], mo = +m[2]; let y = m[3] ? +m[3] : null;

function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function icsExport() {

  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Arbeitsplaner//DE', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Arbeitsplaner'];

    if (!t.due) continue; const f0 = firstDay(t); L.push('BEGIN:VEVENT', `UID:${t.id}@arbeitsplaner`, `DTSTAMP:${stamp}`);
    if (t.time) { const [h, m] = t.time.split(':'); const end = new Date(parseKey(t.due).setHours(+h, +m + (isEvent(t) ? 60 : 30))); L.push(`DTSTART:${ymd(f0)}T${h}${m}00`, `DTEND:${ymd(dkey(end))}T${pad(end.getHours())}${pad(end.getMinutes())}00`); }

function importJson() {

let backupTimer = 0;

let lastShare = '';
function handleShared(d) {

  const sig = JSON.stringify(d); if (sig === lastShare) return; lastShare = sig; setTimeout(() => { if (lastShare === sig) lastShare = ''; }, 3000);
  if (d.action === 'quickadd') { closeModal(); select('smart', 'today'); setTimeout(() => $('#qa-main') && $('#qa-main').focus(), 250); return; }
  const text = String(d.text || '').trim(), subj = String(d.subject || '').trim();
  const first = (subj || text.split('\n')[0] || '').slice(0, 140); const notes = text && text !== first ? text : '';
  const t = newTask({title: first || 'Geteilt', notes}); save('tasks', t); select('smart', 'inbox'); openTask(t.id); toast('Als Aufgabe im Eingang angelegt');
}
function androidSetup() {
  const P = window.Capacitor && window.Capacitor.Plugins; if (!P) return;

}

  if (id === 'qa-main') { if (!t.value.trim()) S.qaOff.clear(); $('#qaChips').innerHTML = t.value.trim() ? quickChips(t.value) : ''; return; }
  if (!S.taskId) return;
  if (id === 'd-title') { autosize(t); const v = t.value.replace(/\n/g, ' '); editTask(S.taskId, x => { x.title = v; }, 600); return; }
  if (id === 'd-notes') { autosize(t); editTask(S.taskId, x => { x.notes = t.value; }, 700); return; }
  if (id.startsWith('sub-')) { const sid = id.slice(4); editTask(S.taskId, x => { x.subtasks = (x.subtasks || []).map(s => s.id === sid ? {...s, title: t.value} : s); }, 600); }
});
document.addEventListener('change', e => {
  const t = e.target; const id = t.id;
  if (id.startsWith('f-dur-')) { const k = id.slice(6); DUR[k] = Math.max(1, Math.min(180, Math.round(+t.value || DUR[k]))); ls.set('ap.dur', DUR); if (!FT.running && FT.mode === k) { FT.remaining = DUR[k] * 60e3; persistTimer(); } render(); return; }
  if (id === 'f-task') { FT.taskId = t.value; persistTimer(); return; }
  if (!S.taskId) return;
  if (id === 'd-date') editTask(S.taskId, x => { if (!t.value) setDates(x, '', ''); else if (isRange(x)) { const n = diffDays(x.due, x.start); setDates(x, t.value, dkey(addDays(parseKey(t.value), n))); } else setDates(x, t.value, ''); });
  if (id === 'd-end') editTask(S.taskId, x => { setDates(x, firstDay(x) || t.value, t.value || ''); });
  if (id === 'd-time') editTask(S.taskId, x => { x.time = t.value || null; if (x.time && !x.due) x.due = todayKey(); if (x.time && x.remind == null && appSet().remindDefault !== false) x.remind = 0; });
  if (id === 'd-remind') editTask(S.taskId, x => { x.remind = t.value === '' ? null : +t.value; });
  if (id === 'd-repeat') { if (t.value === 'custom') { detailSig = null; repeatDialog(S.taskId); render(); return; } editTask(S.taskId, x => { x.repeat = t.value || null; if (REPEAT[t.value] !== undefined) x.repeatFrom = null; if (x.repeat && !x.due) x.due = todayKey(); }); }
  if (id === 'd-list') editTask(S.taskId, x => { x.listId = t.value; });
  if (id === 'd-notes-show') editTask(S.taskId, x => { if (t.checked) x.notesShow = true; else delete x.notesShow; });
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape') {
    if ($('#ctx')) { closeCtx(); return; }
    if (!$('#modal').hidden) { closeModal(); return; }
    if (document.body.classList.contains('side-open')) { document.body.classList.remove('side-open'); return; }
    if (S.taskId) { closeTask(); return; }
    if (t.id === 'search' && S.search) { S.search = ''; t.value = ''; render(); }
    return;
  }
  if (e.key === 'Enter' && !e.isComposing && !e.shiftKey) {
    if (t.id === 'qa-main') { e.preventDefault(); quickAdd('main'); return; }
    if (/^qa-(from|to|time)-/.test(t.id)) { e.preventDefault(); quickAdd(t.id.split('-').pop()); return; }
    if (t.id === 'qa-home') { e.preventDefault(); homeQuickAdd(); return; }
    if (t.id && t.id.startsWith('qa-day')) { e.preventDefault(); const nt = addFromQuick(t.value, {due: S.cal.day}); if (nt) t.value = ''; return; }
    if (t.id && t.id.startsWith('qa-m-')) { e.preventDefault(); const p = +t.dataset.prio; const nt = addFromQuick(t.value, p === 4 ? {priority: 0, matrix: 4} : {priority: p}); if (nt) t.value = ''; return; }
    if (t.id === 'd-newsub') { e.preventDefault(); const v = t.value.trim(); if (!v) return; editTask(S.taskId, x => { x.subtasks = [...(x.subtasks || []), {id: uid(), title: v, done: false}]; }); t.value = ''; return; }
    if (t.id === 'd-newtag') { e.preventDefault(); const v = t.value.trim().replace(/^#/, '').replace(/\s+/g, '-'); if (!v) return; editTask(S.taskId, x => { x.tags = [...new Set([...(x.tags || []), v])]; }); t.value = ''; return; }
    if (t.id && t.id.startsWith('sub-')) { e.preventDefault(); $('#d-newsub')?.focus(); return; }
    if (t.id === 'd-title') { e.preventDefault(); t.blur(); return; }
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable;
  if (typing) return;
  if (!$('#modal').hidden) return;
  if (e.key === ' ' && t.matches('.task[data-id]')) { e.preventDefault(); toggleTask(t.dataset.id); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches('[role=button][data-act]')) { e.preventDefault(); t.click(); return; }
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'z') { if (toastUndo) { e.preventDefault(); const f = toastUndo; toastUndo = null; f(); $('#toast').classList.remove('show'); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const items = $$('.view:not([hidden]) .task[data-id]'); if (!items.length) return; e.preventDefault();
    let i = items.indexOf(t.closest ? t.closest('.task') : null); const dn = e.key === 'ArrowDown';
    i = i < 0 ? (dn ? 0 : items.length - 1) : Math.max(0, Math.min(items.length - 1, i + (dn ? 1 : -1)));
    items[i].focus(); items[i].scrollIntoView({block: 'nearest'}); return;
  }
  const cur = (t.matches && t.matches('.task[data-id]')) ? t.dataset.id : S.taskId;
  if (e.key === 'Delete' && cur) { e.preventDefault(); trashTask(cur); return; }
  if ((e.key === 't' || e.key === 'm') && cur) { e.preventDefault(); const k = e.key === 't' ? todayKey() : dkey(addDays(new Date(), 1)); const prev = (S.tasks.get(cur) || {}).due; editTask(cur, x => { x.due = k; }); toast(e.key === 't' ? 'Auf heute gelegt' : 'Auf morgen gelegt', () => editTask(cur, x => { x.due = prev || null; })); return; }
  if (/^[1-9]$/.test(e.key) && VIEWS[+e.key - 1]) { e.preventDefault(); setView(VIEWS[+e.key - 1].id); return; }
  if (e.key === '?') { e.preventDefault(); shortcutsDialog(); return; }
  if (e.key === 'n' || e.key === 'q') { e.preventDefault(); if (S.view !== 'tasks') setView('tasks'); setTimeout(() => $('#qa-main')?.focus(), 30); }
  if (e.key === '/') { e.preventDefault(); if (S.view !== 'tasks') setView('tasks'); document.body.classList.add('side-open'); setTimeout(() => $('#search')?.focus(), 60); }
});

window.addEventListener('hashchange', () => { const v = viewFromHash(); if (v !== S.view) { S.view = v; S.taskId = null; render(); } });
let lastDay = todayKey();
setInterval(() => { if (S.view === 'home') render(); if (todayKey() !== lastDay) { lastDay = todayKey(); for (const k of ['hmBody', 'hmTitle', 'v-tasks', 'v-calendar', 'v-matrix', 'v-focus', 'v-habits', 'sideContent', 'taskList']) { const el = document.getElementById(k); if (el) el.dataset.html = ''; } render(); } }, 60000);

/* ---------- Android-Zurück-Taste ---------- */
try {
  const AppP = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (AppP) AppP.addListener('backButton', () => {
    if ($('#ctx')) closeCtx();
    else if (!$('#modal').hidden) closeModal();
    else if (document.body.classList.contains('side-open')) document.body.classList.remove('side-open');
    else if (S.taskId) closeTask();
    else if (S.view !== 'home') setView('home');
    else AppP.minimizeApp ? AppP.minimizeApp() : AppP.exitApp();
  });
} catch {}

/* ---------- Start ---------- */
S.view = viewFromHash();
qaOptsInit(); qaSetType(S.qaType);
render();
initStore();
})();
</script>
</body>
